<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Version 16 px : sans étoile, lune plus grande, pour rester nette dans la barre d'outils -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f9e"/>
      <stop offset="1" stop-color="#13163a"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="16" height="16" fill="#fff"/>
      <circle cx="10.6" cy="5.4" r="4.4" fill="#000"/>
    </mask>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <circle cx="7.6" cy="8.4" r="5.4" fill="#f8e2a0" mask="url(#crescent)"/>
</svg>
